<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PayHere Relay</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; }
  </style>
</head>
<body>
  <div class="card">
    <h3 id="msg">Processing...</h3>
    <p id="sub" style="color: #64748b; font-size: 13px;">Please wait...</p>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const dataParam = params.get('d');
  const paymentState = params.get('payment'); // 'success' හෝ 'cancelled'
  const orderId = params.get('order_id');

  // 1. PAYMENT එකට යෑම
  if (dataParam) {
    try {
      const obj = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://sandbox.payhere.lk/pay/checkout';

      for (const k in obj) {
        if (k === 'sandbox' || k === 'secure_token') continue;
        const i = document.createElement('input');
        i.type = 'hidden'; 
        i.name = k; 
        i.value = obj[k];
        form.appendChild(i);
      }
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      document.getElementById('msg').innerText = "Error: " + e.message;
    }
  } 
  // 2. ශිෂ්‍යයා CANCEL හෝ BACK TO SITE කළ අවස්ථාව
  else if (paymentState === 'cancelled') {
    document.getElementById('msg').innerText = "Payment Cancelled";
    document.getElementById('msg').style.color = "#dc2626";
    document.getElementById('sub').innerText = "Transaction was cancelled. Returning...";

    if (window.opener) {
      // මුල් පිටුවට CANCEL වූ බව දන්වයි
      window.opener.postMessage({ type: 'PAYHERE_CANCELLED' }, '*');
      setTimeout(() => { window.close(); }, 1500);
    }
  }
  // 3. PAYMENT එක ඇත්තටම SUCCESS වූ අවස්ථාව පමණක්
  else if (paymentState === 'success') {
    document.getElementById('msg').innerText = "Payment Successful!";
    document.getElementById('msg').style.color = "#16a34a";
    document.getElementById('sub').innerText = "Finalizing application...";

    if (window.opener) {
      // මුල් පිටුවට SUCCESS වූ බව දන්වයි
      window.opener.postMessage({ 
        type: 'PAYHERE_SUCCESS', 
        orderId: orderId || params.get('payment_id') 
      }, '*');
      setTimeout(() => { window.close(); }, 1500);
    }
  }
</script>
</body>
</html>
