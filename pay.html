<!DOCTYPE html><html><body><p>Redirecting to PayHere...</p>
<script>
  const raw = new URLSearchParams(location.search).get('d');
  const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = 'https://sandbox.payhere.lk/pay/checkout'; // live wedi www.payhere.lk
  for (const k in obj) {
    if (k === 'sandbox') continue;
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = obj[k];
    form.appendChild(i);
  }
  document.body.appendChild(form);
  form.submit();
</script></body></html>
